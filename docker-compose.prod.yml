services:

  # ─── Base de données PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: always
    container_name: garage_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de port exposé publiquement — uniquement réseau interne Docker
    networks:
      - garage_internal

  # ─── Redis (cache, sessions) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    container_name: garage_redis_prod
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garage_internal

  # ─── Application Django (Gunicorn) ─────────────────────────────────────
  web:
   build:
    context: .
    dockerfile: Dockerfile.prod
   restart: always
   container_name: garage_web_prod
   command: >
    sh -c "python manage.py makemigrations accounts &&
           python manage.py makemigrations vehicules &&
           python manage.py makemigrations atelier &&
           python manage.py makemigrations reception &&
           python manage.py makemigrations guerite &&
           python manage.py makemigrations audit &&
           python manage.py migrate &&
           python manage.py collectstatic --noinput &&
           gunicorn garage.wsgi:application
             --bind 0.0.0.0:8000
             --workers 2
             --threads 2
             --timeout 90
             --access-logfile /app/logs/access.log
             --error-logfile /app/logs/error.log"
   volumes:
    - static_volume:/app/staticfiles
    - media_volume:/app/media
    - logs_volume:/app/logs
   environment:
    - DJANGO_SETTINGS_MODULE=garage.settings.production
    - DEBUG=False
    - SECRET_KEY=${SECRET_KEY}
    - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
    - DB_HOST=db
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - DB_PORT=${DB_PORT}                    # ⬅️ AJOUT OBLIGATOIRE
    - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    - EMAIL_HOST=${EMAIL_HOST}
    - EMAIL_HOST_USER=${EMAIL_HOST_USER}
    - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
    - ADMIN_EMAIL=${ADMIN_EMAIL}
    - SENTRY_DSN=${SENTRY_DSN}
   depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
   networks:
    - garage_internal

  # ─── Nginx (reverse proxy + SSL) ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    container_name: garage_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - garage_internal

  # ─── Certbot (renouvellement SSL automatique) ──────────────────────────
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h;
             done"

  # ─── Sauvegarde automatique DB (cron quotidien) ────────────────────────
  backup:
    image: postgres:15-alpine
    restart: always
    container_name: garage_backup
    volumes:
      - ./backups:/backups
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    entrypoint: >
      sh -c "while :; do
               pg_dump -h db -U ${DB_USER} -d ${DB_NAME} -F c -f /backups/backup_$$(date +%Y%m%d_%H%M%S).dump;
               find /backups -name '*.dump' -mtime +14 -delete;
               sleep 86400;
             done"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - garage_internal

networks:
  garage_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  certbot_certs:
  certbot_www:
