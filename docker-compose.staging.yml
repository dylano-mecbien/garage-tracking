services:

  # ─── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: garage_db_test
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garage_test

  # ─── pgAdmin (accès local uniquement) ───────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: garage_pgadmin_test
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - garage_test

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: garage_redis_test
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garage_test

  # ─── MinIO ──────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: garage_minio_test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data_test:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garage_test

  # ─── Django / Gunicorn ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: garage_web_test
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py create_default_admin &&
             gunicorn garage.wsgi:application
               --bind 0.0.0.0:8000
               --workers 2
               --threads 2
               --worker-class gthread
               --timeout 60"
    volumes:
      - static_volume_test:/app/staticfiles
      - media_volume_test:/app/media
      - logs_volume_test:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=garage.settings.production
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-False}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - SENTRY_DSN=${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - garage_test

  # ─── Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: garage_nginx_test
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume_test:/app/staticfiles:ro
      - media_volume_test:/app/media:ro
      - certbot_certs_test:/etc/letsencrypt:ro
      - certbot_www_test:/var/www/certbot
    depends_on:
      - web
    networks:
      - garage_test

  # ─── Certbot ────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: garage_certbot_test
    restart: unless-stopped
    volumes:
      - certbot_certs_test:/etc/letsencrypt
      - certbot_www_test:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h;
             done"
    networks:
      - garage_test

  # ─── Backup DB quotidien ────────────────────────────────────
  backup:
    image: postgres:15-alpine
    container_name: garage_backup_test
    restart: always
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while :; do
               pg_dump -h db -U $${DB_USER} -d $${DB_NAME} -F c
                 -f /backups/backup_$$(date +%Y%m%d_%H%M%S).dump;
               find /backups -name '*.dump' -mtime +7 -delete;
               sleep 86400;
             done"
    environment:
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
      - PGPASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - garage_test

networks:
  garage_test:
    driver: bridge

volumes:
  postgres_data_test:
  redis_data_test:
  static_volume_test:
  media_volume_test:
  logs_volume_test:
  certbot_certs_test:
  certbot_www_test:
  minio_data_test: