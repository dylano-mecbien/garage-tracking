upstream garage_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;


   # Intercepte les erreurs du serveur en amont (Django)
    proxy_intercept_errors on;

    # Définit la page d'erreur pour les codes 500, 502, 503, 504
    error_page 500 502 503 504 /error_pages/50x.html;
    
    # Location pour servir le fichier d'erreur
    location = /error_pages/50x.html {
        internal; # Empêche l'accès direct via l'URL
        root /usr/share/nginx/html;
    }

    
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        
        proxy_pass http://garage_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}












