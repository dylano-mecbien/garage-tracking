upstream django_test {
    server web:8000;
}

# HTTP → ACME + redirect HTTPS
server {
    listen 80;
    server_name dev.laprudenceplus-cm.com;  # ← ton domaine test

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name dev.laprudenceplus-cm.com ;

    # Après le premier certbot, décommente :
    # ssl_certificate     /etc/letsencrypt/live/dev.laprudenceplus-cm.com /fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dev.laprudenceplus-cm.com /privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;

    # Temporaire si pas encore de certificat (retire après certbot)
    ssl_certificate     /etc/nginx/ssl/dummy.crt;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;

    client_max_body_size 50M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://django_test;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}