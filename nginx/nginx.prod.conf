# ─── Redirection HTTP → HTTPS + challenge Let's Encrypt ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name garage.laprudenceplus-cm.com;

    # Challenge ACME – doit être AVANT la redirection
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Serveur HTTPS principal ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name garage.laprudenceplus-cm.com;

    client_max_body_size 50M;

    # Chemins des certificats (une fois obtenus)
    ssl_certificate     /etc/letsencrypt/live/garage.laprudenceplus-cm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garage.laprudenceplus-cm.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # En-têtes de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Fichiers statiques
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fichiers media
    location /media/ {
        alias /app/media/;
        expires 7d;
        location ~* \.(php|py|sh)$ { deny all; }
    }

    # Application Django via Gunicorn
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Limitation des tentatives de connexion
    location /auth/connexion/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}