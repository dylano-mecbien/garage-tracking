# ============================================
# garage_app — Nginx Reverse Proxy + SSL
# ============================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Upstream Gunicorn — HTTP seulement (pas HTTPS)
upstream garage_app {
    server web:8000;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ────────────────────────────────────────
server {
    listen 80;
    server_name garage.laprudenceplus-cm.com;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name garage.laprudenceplus-cm.com;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/garage.laprudenceplus-cm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garage.laprudenceplus-cm.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers sécurité
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;

    # Taille max upload (photos véhicules, PDFs)
    client_max_body_size 50M;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        image/svg+xml;

    # ── Fichiers statiques — servis directement par Nginx ────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Fichiers media (uploads) ─────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

 

    # ── Health check — pas de rate limit, pas de log ─────────────
    # BUG CORRIGÉ : un seul bloc /health (deux blocs identiques = erreur Nginx)
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # ── Auth — rate limit strict ─────────────────────────────────
    location ~ ^/(accounts/connexion|api/v1/auth/(login|register|forgot-password)) {
        limit_req zone=auth burst=3 nodelay;

        proxy_pass         http://garage_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Application principale ───────────────────────────────────
    # BUG CORRIGÉ : un seul proxy_pass (deux proxy_pass = erreur Nginx)
    location / {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://garage_app;   # upstream défini plus haut
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}